name: Weekly Price Check

# 🔴 2026-10-26: 이 워크플로는 이제 **수집하지 않는다. 감시만 한다.**
#    수집은 로컬 launchd(`ops/kiwi-prices.plist`, 일 18:00 NZ → `scripts/collect_prices_local.sh`)가 한다.
#    GitHub 러너에서는 마트 사이트에 닿지 않는다 — 08-23 이후 12회 중 플래너 캐시 0/197 매번,
#    Woolworths 지수 0/18 열한 번, Pak'nSave·New World는 매번 Cloudflare 403(buildId 추출 실패).
#    그런데도 지수 스크립트가 열 날짜를 올려 **옛 값을 새 관측으로** 커밋했다(라이브 가짜 6점, PR #147).
#    읽지 못하는 곳에서 수집기를 돌릴 이유가 없다. 챌린지 우회는 하지 않는다.
#
# 남긴 것: 로컬 수집이 멈추거나 본문 수치가 가격과 어긋나면 **빨간불**이 되는 검사.
on:
  # 목요일 09:00 NZDT / 08:00 NZST (UTC 수요일 20:00).
  # 일요일 수집분이 월요일까지 병합되면 목요일엔 4일이다. 일요일을 한 번 놓치면 11일 → 10일 가드에 걸린다.
  # 월요일에 두지 않는 이유: 그날 아침엔 지난주 특가가 막 만료돼 전단을 넣기 전까지 가드가 **옳게** 빨갛다 —
  #   매주 뜨는 빨간불은 아무도 안 본다(08-30 실패를 6일간 몰랐다).
  schedule:
    - cron: "0 20 * * 3"
  workflow_dispatch:

jobs:
  check-prices:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm install --no-save --no-audit --no-fund

      # 🔴 2026-08-18: 가격이 바뀌면 본문에 손으로 적힌 비용 수치가 안 따라온다 — 한 번 돌렸더니
      #    게시된 주장 5건이 곧바로 거짓이 됐다. 그 가드는 vitest에만 있어서 사람이 돌릴 때까지 모른다.
      - name: Content claims must still match the prices
        id: claims
        continue-on-error: true
        run: npx vitest run

      # 🔴 2026-09-06: vitest가 전부 통과하는데 `next build`의 tsc가 깨져 배포가 조용히 멈췄다.
      - name: Types must still compile
        id: types
        continue-on-error: true
        run: npm run typecheck

      # 🔴 2026-09-25: 앞 단계가 실패하면 이 검사가 통째로 건너뛰어졌다 — 그래서 앞 둘은
      #    continue-on-error로 끝까지 돌고, 결과(outcome)를 **여기 한 곳에서** 모아 판정한다.
      #    continue-on-error만 붙이면 실패가 초록으로 삼켜지므로 아래에서 다시 본다.
      - name: Fail if the published data has gone stale
        env:
          CLAIMS_OUTCOME: ${{ steps.claims.outcome }}
          TYPES_OUTCOME: ${{ steps.types.outcome }}
        run: |
          node -e '
            const DAY = 86400000, MAX_AGE = 10;
            let bad = false;

            // 앞 검사 두 개의 결과 — "success"가 아니면 전부 실패로 친다(빈 값·skipped 포함).
            for (const [name, v] of [["콘텐츠 주장(vitest)", process.env.CLAIMS_OUTCOME],
                                     ["타입 검사(tsc)", process.env.TYPES_OUTCOME]]) {
              console.log(`${name}: ${v || "(결과 없음)"}`);
              if (v !== "success") { console.error(`❌ ${name}이 통과하지 못했다 — 위 단계 로그를 볼 것.`); bad = true; }
            }

            const idx = require("./data/priceIndex.json");
            const idxAge = Math.floor((Date.now() - Date.parse(idx.lastUpdated)) / DAY);
            console.log(`가격지수 lastUpdated=${idx.lastUpdated} (${idxAge}일 전)`);
            for (const k of Object.keys(idx).filter(k => k.endsWith("Updated") && k !== "lastUpdated")) {
              console.log(`  ${k}=${idx[k]}`);
            }
            if (!Number.isFinite(idxAge)) {
              console.error(`❌ 지수 lastUpdated를 날짜로 못 읽었다(${JSON.stringify(idx.lastUpdated)}) — 나이를 모르면 통과가 아니다.`);
              bad = true;
            } else if (idxAge > MAX_AGE) {
              console.error(`❌ 지수가 ${idxAge}일째 낡았다 — 로컬 수집(일 18:00 NZ)이 멈췄거나 병합이 안 됐다. ~/Library/Logs/kiwilunchbox-prices.log를 볼 것.`);
              bad = true;
            }

            // 남섬 지수(2026-10-28~) — 파일이 생긴 뒤로는 북섬과 같은 기준으로 본다.
            const fs = require("fs");
            if (fs.existsSync("./data/priceIndex.south.json")) {
              const si = require("./data/priceIndex.south.json");
              const siAge = Math.floor((Date.now() - Date.parse(si.lastUpdated)) / DAY);
              console.log(`남섬 가격지수 lastUpdated=${si.lastUpdated} (${siAge}일 전)`);
              if (!Number.isFinite(siAge)) {
                console.error(`❌ 남섬 지수 lastUpdated를 날짜로 못 읽었다(${JSON.stringify(si.lastUpdated)}).`);
                bad = true;
              } else if (siAge > MAX_AGE) {
                console.error(`❌ 남섬 지수가 ${siAge}일째 낡았다 — 로컬 수집의 남섬 단계를 볼 것.`);
                bad = true;
              }
            }

            const cache = require("./data/price_cache.json");
            const stamps = Object.values(cache).map(v => v && v.timestamp).filter(Boolean);
            const cacheAge = Math.floor((Date.now() - Math.max(...stamps)) / DAY);
            console.log(`플래너 가격캐시 ${stamps.length}개 · 가장 최신이 ${cacheAge}일 전`);
            if (!Number.isFinite(cacheAge) || cacheAge < 0) {
              console.error(`❌ 플래너 캐시 나이를 못 읽었다(${cacheAge}) — 나이를 모르면 통과가 아니다.`);
              bad = true;
            } else if (cacheAge > MAX_AGE) {
              console.error(`❌ 플래너 캐시가 ${cacheAge}일째 낡았다 — 도시락 비용이 옛 가격으로 나온다.`);
              bad = true;
            }

            // 남섬 플래너 캐시(2026-10-28~) — 남섬을 고른 사람의 도시락 비용이 여기서 나온다.
            if (fs.existsSync("./data/price_cache.south.json")) {
              const sc = require("./data/price_cache.south.json");
              const ss = Object.values(sc).map(v => v && v.timestamp).filter(Boolean);
              const scAge = Math.floor((Date.now() - Math.max(...ss)) / DAY);
              console.log(`남섬 플래너 캐시 ${ss.length}개 · 가장 최신이 ${scAge}일 전`);
              if (!Number.isFinite(scAge) || scAge < 0) {
                console.error(`❌ 남섬 플래너 캐시 나이를 못 읽었다(${scAge}).`);
                bad = true;
              } else if (scAge > MAX_AGE) {
                console.error(`❌ 남섬 플래너 캐시가 ${scAge}일째 낡았다 — 남섬 도시락 비용이 옛 가격으로 나온다.`);
                bad = true;
              }
            }

            if (bad) process.exit(1);
          '
